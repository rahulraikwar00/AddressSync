services:
  backend:
    build: .
    container_name: address-sync-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/address_sync.db
      - SECRET_KEY=dev-secret-change-me
      - DEV_MODE=true
      - WEBHOOK_BASE_URL=http://127.0.0.1:8000
    restart: unless-stopped
